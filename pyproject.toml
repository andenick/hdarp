[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdarp"
version = "5.1"
description = "Multi-engine OCR consensus and density-aware PDF chunking (HDARP v5.1 snapshot)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nicholas Anderson" }]
keywords = ["ocr", "pdf", "consensus", "extraction"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]

# Minimal install: enough to import hdarp, chunk PDFs and run the consensus
# engine. The OCR engines themselves are optional extras — see [project.optional-dependencies].
dependencies = [
    "pypdf>=4.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# PyMuPDF is AGPL-3.0-or-commercial; installing this extra makes that licence
# apply to your build. See "Third-party components and licences" in README.md.
pdf = ["PyMuPDF>=1.23.0"]
ocr = [
    "paddlepaddle>=2.5.0",
    "paddleocr>=2.7.0",
    "easyocr>=1.7.0",
    "pytesseract>=0.3.10",
]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/andenick/hdarp"

[project.scripts]
hdarp-split = "hdarp.splitter:main"
hdarp-process = "hdarp.processor:main"
hdarp-batch = "hdarp.orchestrator:main"

[tool.setuptools]
packages = ["hdarp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
